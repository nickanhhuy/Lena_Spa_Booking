<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Reset Your Password</h2>
      <p>Enter your new password below</p>
    </div>
    
    <form (ngSubmit)="resetPassword()" class="auth-form" *ngIf="!isSuccess && token">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input 
          id="newPassword"
          type="password" 
          [(ngModel)]="newPassword" 
          name="newPassword" 
          placeholder="Enter new password"
          required 
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          id="confirmPassword"
          type="password" 
          [(ngModel)]="confirmPassword" 
          name="confirmPassword" 
          placeholder="Confirm new password"
          required 
        />
      </div>
      
      <div class="error-message" *ngIf="message && !isSuccess">
        {{ message }}
      </div>
      
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <div class="success-section" *ngIf="isSuccess">
      <div class="success-icon">✅</div>
      <div class="success-message">
        {{ message }}
      </div>
      <p class="redirect-message">You will be redirected to the login page in a few seconds...</p>
      <button class="btn-primary" (click)="goToLogin()">Go to Login Now</button>
    </div>

    <div class="error-section" *ngIf="!token">
      <div class="error-icon">❌</div>
      <div class="error-message">
        {{ message }}
      </div>
      <button class="btn-secondary" (click)="goToLogin()">Back to Login</button>
    </div>
    
    <div class="auth-footer" *ngIf="token && !isSuccess">
      <p>Remember your password?</p>
      <a (click)="goToLogin()" class="link">Back to Login</a>
    </div>
  </div>
</div>
