<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your account to continue shopping</p>
    </div>
    
    <form (ngSubmit)="login()" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          id="email"
          type="email" 
          [(ngModel)]="credentials.email" 
          name="email" 
          placeholder="Enter your email address"
          required 
        />
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password"
          type="password" 
          [(ngModel)]="credentials.password" 
          name="password" 
          placeholder="Enter your password"
          required 
        />
      </div>
      
      <div class="error-message" *ngIf="message">
        {{ message }}
      </div>

      <!-- Resend Verification Section -->
      <div class="resend-verification" *ngIf="showResendVerification">
        <div class="verification-prompt">
          <p>Need to resend verification email?</p>
          <div class="form-group">
            <input 
              type="email" 
              [(ngModel)]="resendEmail" 
              name="resendEmail"
              placeholder="Enter your email address"
              class="form-control"
            />
          </div>
          <button type="button" class="btn-secondary" (click)="resendVerificationEmail()">
            Resend Verification Email
          </button>
        </div>
      </div>
      
      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div class="forgot-password-link">
      <a routerLink="/forgot-password">Forgot your password?</a>
    </div>
    
    <div class="auth-footer">
      <p>Don't have an account?</p>
      <a routerLink="/app-signup">Create Account</a>
    </div>
  </div>
</div>
