<h2>Log In</h2>
<form (ngSubmit)="login()">
  <label>Username:</label>
  <input [(ngModel)]="credentials.username" name="username" required />
  <br />
  <label>Password:</label>
  <input type="password" [(ngModel)]="credentials.password" name="password" required />
  <br />
  <button type="submit">Log In</button>
</form>
<p>{{ message }}</p>
<div class="signup">
    <a routerLink="/app-signup">Don't have an account? Register now</a>
</div>
