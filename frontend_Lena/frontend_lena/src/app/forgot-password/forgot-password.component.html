<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Forgot Password?</h2>
      <p>Enter your email address and we'll send you a link to reset your password</p>
    </div>
    
    <form (ngSubmit)="requestPasswordReset()" class="auth-form" *ngIf="!isSuccess">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          id="email"
          type="email" 
          [(ngModel)]="email" 
          name="email" 
          placeholder="Enter your email address"
          required 
        />
      </div>
      
      <div class="error-message" *ngIf="message && !isSuccess">
        {{ message }}
      </div>
      
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <div class="success-section" *ngIf="isSuccess">
      <div class="success-icon">✅</div>
      <div class="success-message">
        {{ message }}
      </div>
      <p class="info-text">Please check your email inbox and spam folder for the password reset link.</p>
    </div>
    
    <div class="auth-footer">
      <p>Remember your password?</p>
      <a (click)="goToLogin()" class="link">Back to Login</a>
    </div>
  </div>
</div>
