<div class="verification-container">
  <div class="verification-card">
    <!-- Loading State -->
    <div *ngIf="verificationStatus === 'loading'" class="text-center">
      <div class="spinner"></div>
      <h2>Verifying your email...</h2>
      <p>Please wait while we verify your email address.</p>
    </div>

    <!-- Success State -->
    <div *ngIf="verificationStatus === 'success'" class="text-center success">
      <div class="success-icon">✅</div>
      <h2>Email Verified Successfully!</h2>
      <p>{{ message }}</p>
      <p class="redirect-message">You will be redirected to the login page in a few seconds...</p>
      <button class="btn btn-primary" (click)="goToLogin()">Go to Login Now</button>
    </div>

    <!-- Error State -->
    <div *ngIf="verificationStatus === 'error'" class="text-center error">
      <div class="error-icon">❌</div>
      <h2>Verification Failed</h2>
      <p>{{ message }}</p>
      
      <div class="resend-section">
        <h3>Need a new verification email?</h3>
        <div class="form-group">
          <input 
            type="email" 
            [(ngModel)]="email" 
            placeholder="Enter your email address"
            class="form-control"
            required>
        </div>
        <button 
          class="btn btn-secondary" 
          (click)="resendVerificationEmail()"
          [disabled]="isResending">
          {{ isResending ? 'Sending...' : 'Resend Verification Email' }}
        </button>
      </div>
      
      <div class="login-link">
        <p>Already verified? <a (click)="goToLogin()" class="link">Go to Login</a></p>
      </div>
    </div>
  </div>
</div>
