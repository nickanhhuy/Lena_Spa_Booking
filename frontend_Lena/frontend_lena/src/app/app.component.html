<div class="app-wrapper">
    <header class="app-header" *ngIf="shouldShowHeader()">
        <nav class="app-navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <a routerLink="/app-home">Lena Spa</a>
                </div>
                
                <div class="nav-links">
                    <a routerLink="/app-home" routerLinkActive="active">HOME</a>
                    <a routerLink="/app-booking-form" routerLinkActive="active">BOOK NOW</a>
                    <a routerLink="/app-booking-list" routerLinkActive="active">MY BOOKING</a>
                    <a routerLink="/app-profile" routerLinkActive="active" *ngIf="isLoggedIn()">PROFILE</a>
                    <a routerLink="/app-contact" routerLinkActive="active">CONTACT</a>
                </div>
                
                <div class="nav-auth">
                    <ng-container *ngIf="!isLoggedIn(); else loggedInBlock">
                        <a routerLink="/app-login" class="btn-auth">LOGIN / SIGN UP</a>
                    </ng-container>

                    <ng-template #loggedInBlock>
                        <div class="user-menu">
                            <span class="user-greeting">Hi, {{ getUsername() }}</span>
                            <button (click)="logout()" class="btn-logout">LOGOUT</button>
                        </div>
                    </ng-template>
                </div>
            </div>
        </nav>
    </header>

    <main class="app-main">
        <router-outlet></router-outlet>
    </main>
</div>
